<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 7: Product Catalog Display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Activity 7: Product Catalog</h1>
    <p>Please open the console (F12) to view the activity logs.</p>

    <div class="catalog-container">
        <section class="controls">
            <input type="text" id="search-input" placeholder="Search by name...">
            <select id="filter-select">
                <option value="all">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="books">Books</option>
            </select>
            <button id="clear-btn">Clear Filters</button>
            <div id="result-count">Showing 0 products</div>
        </section>

        <div id="product-grid"></div>
    </div>

    <script src="demos.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
